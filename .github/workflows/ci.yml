name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uvx ruff@0.17.3 check src tests config.py
          uvx ruff@0.17.3 format --check src tests config.py

      - name: Tests
        run: uv run pytest tests -q -ra -m "not integration" || [ $? -eq 5 ]
